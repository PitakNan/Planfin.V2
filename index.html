<style>
:root{
  --nav-h:52px; --bg:#f3f6fa; --panel:#fff; --panel2:#f8fafc; --text:#0f172a; --muted:#5b6b82; --border:#dfe6ef;
  --accent:#1d4ed8; --plan:#64748b; --actual:#1d4ed8;
  --ok:#15803d; --ok-bg:#dcfce7; --over:#c2410c; --over-bg:#ffedd5; --under:#6d28d9; --under-bg:#ede9fe; --na:#64748b; --na-bg:#e2e8f0;
  --good:#a16207; --good-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --neg:#dc2626; --band:rgba(21,128,61,.14); --shadow:0 1px 3px rgba(15,23,42,.08);
}
:root[data-theme="dark"]{
  --bg:#0b1220; --panel:#111a2e; --panel2:#0e1627; --text:#e5e9f2; --muted:#93a0b6; --border:#243049;
  --accent:#6ea0ff; --plan:#94a3b8; --actual:#6ea0ff;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --over:#fb923c; --over-bg:rgba(251,146,60,.16); --under:#a78bfa; --under-bg:rgba(167,139,250,.16); --na:#94a3b8; --na-bg:rgba(148,163,184,.16);
  --good:#fbbf24; --good-bg:rgba(251,191,36,.16); --bad:#f87171; --bad-bg:rgba(248,113,113,.18);
  --neg:#f87171; --band:rgba(74,222,128,.16); --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun','Noto Sans Thai','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
button{font-family:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Navbar / Drawer ---------- */
.navbar{position:sticky;top:0;z-index:70;height:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.navlinks{display:flex;gap:4px}
.navlinks a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px}
.navlinks a.active{background:var(--accent);color:#fff}
.icon-btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:17px}
.hamburger{display:none}
.drawer{position:fixed;top:0;left:0;height:100%;width:260px;background:var(--panel);border-right:1px solid var(--border);z-index:90;transform:translateX(-100%);transition:transform .25s ease;padding:12px;display:flex;flex-direction:column;gap:4px}
.drawer.open{transform:translateX(0)}
.drawer a{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--text)}
.drawer a.active{background:var(--accent);color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
.backdrop.show{display:block}
@media(max-width:768px){#hf{position:static}#hf .seg{flex-wrap:nowrap!important;overflow-x:auto;max-width:100%}.navlinks{display:none}.hamburger{display:inline-flex}.brand small{display:none}}

/* ---------- Layout ---------- */
.wrap{padding:14px;max-width:1280px;margin:0 auto}
h2{font-size:18px;margin:18px 0 10px}
h3{font-size:15.5px;margin:0}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.clk{cursor:pointer;transition:border-color .15s,box-shadow .15s;min-height:44px}
.kpi.clk:hover{border-color:var(--actual)}
.kpi.clk:focus-visible{outline:2px solid var(--actual);outline-offset:2px}
.kpi.clk.on{border-color:var(--actual);box-shadow:0 0 0 2px var(--actual) inset}
.kpi .hint{font-size:11.5px;opacity:.85}
@media print{.kpi .hint{display:none}}
.badgebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.over{background:var(--over-bg);color:var(--over)}
.pill.under{background:var(--under-bg);color:var(--under)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.hl{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.hl.ok{background:var(--ok-bg);color:var(--ok)}.hl.good{background:var(--good-bg);color:var(--good)}.hl.bad{background:var(--bad-bg);color:var(--bad)}
.hl.strong{font-weight:800;padding:2px 9px;box-shadow:0 0 0 1px currentColor inset}
.legendq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 2px;font-size:12.5px;color:var(--muted)}
.pill.na{background:var(--na-bg);color:var(--na)}

/* ---------- Sticky filter bar ---------- */
.filter-bar{position:sticky;top:var(--nav-h);z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 14px rgba(0,0,0,.08);margin:12px 0}
.chip,.btn{min-height:44px;min-width:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;font-size:14px;cursor:pointer}
.chip.active,.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;min-width:44px;padding:6px 14px;border:0;background:transparent;cursor:pointer;font-size:14px}
.seg button.active{background:var(--accent);color:#fff}
.search{min-height:44px;padding:6px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-size:14px;min-width:0;flex:1 1 160px}
.sp{flex:1}

/* ---------- Dropdown ---------- */
.dd{position:relative}
.dd-panel{position:absolute;top:48px;left:0;width:min(340px,86vw);max-height:340px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:65;display:none}
.dd-panel.open{display:block}
.dd-group{position:sticky;top:0;background:var(--panel2);padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.dd-item{padding:8px 12px;min-height:44px;display:flex;align-items:center;cursor:pointer;gap:6px}
.dd-item:hover{background:var(--panel2)}
.dd-search{position:sticky;top:0;z-index:2;padding:8px;background:var(--panel)}

/* ---------- Tables ---------- */
.tablebox{overflow:auto;max-height:76vh;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);z-index:3;font-weight:600;cursor:pointer;user-select:none;font-size:13px}
th.l,td.l{text-align:left}
td.l,th.l{position:sticky;left:0;background:var(--panel);z-index:2}
th.l{z-index:4;background:var(--panel2)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--panel2)}
tr.grp td{background:var(--panel2);font-weight:700;text-align:left;font-size:13px;color:var(--muted)}
td .sub{display:block;font-size:11.5px;color:var(--muted)}
.hname{white-space:normal;min-width:150px;max-width:230px}
.neg{color:var(--neg)}

/* diverging mini bar (chart mode ในตาราง) */
.dv{position:relative;width:128px;height:22px;display:inline-block;vertical-align:middle}
.dv .tr{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--na-bg);border-radius:3px}
.dv .bd{position:absolute;top:3px;bottom:3px;background:var(--ok-bg);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.dv .z{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--muted)}
.dv .b{position:absolute;top:5px;height:12px;border-radius:2px}
.dv .b.good{background:var(--good)}.dv .b.bad{background:var(--bad)}
.dv .b.ok{background:var(--ok)}.dv .b.over{background:var(--over)}.dv .b.under{background:var(--under)}.dv .b.na{background:var(--na)}
.dvt{display:inline-block;min-width:58px;text-align:right}

/* ---------- Panels & charts ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.panel-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.panel-hd .sp{flex:1}
.pair{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:768px){.pair{grid-template-columns:1fr}}
.chartbox{position:relative}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y}
svg text{fill:var(--muted);font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.legend i.d{border-top-style:dashed}
.legend i.bx{width:14px;height:10px;border:0;background:var(--band);border-top:0}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:8px;padding:8px 10px;font-size:12.5px;display:none;max-width:260px}
.diffline{margin-top:8px;font-size:14px;text-align:center}
.diffline b{font-size:17px}
.mt td,.mt th{font-size:13.5px}
.mt tr.ytd td{font-weight:700;background:var(--panel2)}
.acc-row td{padding:0;background:var(--panel2);white-space:normal}
.acc-in{padding:12px;position:sticky;left:0;box-sizing:border-box;width:min(calc(100vw - 32px),1250px)}
.filter-bar.ns{position:static}
.note{font-size:13px;color:var(--muted)}
.warnbox{border-left:4px solid var(--over);background:var(--over-bg);padding:8px 12px;border-radius:8px;font-size:13.5px}
.hide{display:none!important}
.foot{margin:24px 0 40px;text-align:center;font-size:13px;color:var(--muted)}
details.card>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 16px;border-radius:10px;z-index:300;box-shadow:0 8px 22px rgba(0,0,0,.3);display:none}

@media print{
  .navbar,.drawer,.backdrop,.filter-bar,.icon-btn,.seg,.hamburger{display:none!important}
  body{background:#fff;color:#000}
  .tablebox{max-height:none!important;overflow:visible!important}
  .panel,.card,tr{break-inside:avoid}
  .acc-row.collapsed{display:table-row!important}
}
</style>

<script>
'use strict';
/* ====================== ข้อมูล ====================== */
var META, PLAN, ACT, TOL = 5, MONTHS = [], HOSP = {}, CACHE = {};
var MODE = 'chart';           // chart | num  (จำค่าไว้)
try { MODE = localStorage.getItem('pfm-mode') || 'chart'; } catch (e) {}
var DATA_STALE = false;

function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- ฟังก์ชันจัดรูปแบบ (ชื่อไม่ซ้ำกับ dashboard อื่น) ---- */
function fmtMB(v) { return v == null ? '–' : (v / 1e6).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtBaht(v) { return v == null ? '–' : Math.round(v).toLocaleString('th-TH'); }
function fmtPctSigned(p) { return p == null ? 'แผน 0' : (p > 0 ? '+' : '') + p.toFixed(1) + '%'; }
function thaiDateTime(iso) {
  if (!iso) return '-'; var d = new Date(iso); if (isNaN(d)) return iso;
  var mn = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  return d.getDate() + ' ' + mn[d.getMonth()] + ' ' + (d.getFullYear() + 543 - 2500) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.';
}
/* เดือนในปีงบ -> ปี พ.ศ. 2 หลัก : ต.ค.-ธ.ค. = ปี FY-1 */
function monthLabel(k) { var fy = META.fy % 100; var yy = k < 3 ? fy - 1 : fy; return MONTHS[k] + yy; }

/* ====================== คำนวณ ====================== */
function annualOf(hc, item) {                          // แผนทั้งปีของเวอร์ชันล่าสุด (ถ้ามีปรับแผน ใช้แผนใหม่ทั้งปี)
  var v = 0;
  PLAN.versions.forEach(function (ver) { var a = ver.annual[hc]; if (a && a[item] != null) v = a[item]; });
  return v;
}
function planM(hc, item, k) { return annualOf(hc, item) / 12; }   // แผนรายเดือน = ทั้งปี ÷ 12 (วิธีเดียวกับ กศภ.)
/* pol: +1 = สูงกว่าแผนถือว่าดี (รายได้ NI EBITDA) ; -1 = ต่ำกว่าแผนถือว่าดี (ค่าใช้จ่าย) — ใช้กับสีเท่านั้น การนับ "ผิดแผน" ยังดูแค่ ±TOL */
var POL = {};
function polOf(item) { if (!POL[item]) { var it = META.items.filter(function (i) { return i.id === item; })[0]; POL[item] = it && it.g.indexOf('exp') >= 0 || it && it.g === 'sumexp' ? -1 : 1; } return POL[item]; }
function judge(act, pl, pol) {
  var diff = act - pl, pct = null; pol = pol || 1;
  if (pl !== 0) pct = Math.round(diff / Math.abs(pl) * 1000) / 10;   // ตัดสินจากค่าที่แสดง (ปัด 1 ตำแหน่ง)
  else if (act === 0) pct = 0;
  var st = pct == null ? 'over' : (Math.abs(pct) <= TOL ? 'ok' : (diff > 0 ? 'over' : 'under'));
  var q = st === 'ok' ? 'ok' : ((st === 'over') === (pol > 0) ? 'good' : 'bad');   // good = ผิดแผนทางดี (เหลือง) · bad = ผิดแผนทางร้าย (แดง)
  return { diff: diff, pct: pct, st: st, q: q, pol: pol };
}
function evalSeries(am, pm, L, item) {                 // am/pm = 12 ช่อง ; L = จำนวนเดือนที่มีผลจริง
  var act = 0, pl = 0;
  for (var k = 0; k < L; k++) { act += am[k] || 0; pl += pm[k]; }
  var j = judge(act, pl, polOf(item));
  return { act: act, plan: pl, diff: j.diff, pct: j.pct, st: j.st, q: j.q, pol: j.pol, L: L, am: am, pm: pm };
}
function evalItem(hc, item) {
  var key = hc + '|' + item; if (CACHE[key]) return CACHE[key];
  var A = ACT[hc]; if (!A || !A.L) return (CACHE[key] = null);
  var arr = A.m[item] || [], am = [], pm = [];
  for (var k = 0; k < 12; k++) { am.push(k < A.L ? (arr[k] == null ? 0 : arr[k]) : null); pm.push(planM(hc, item, k)); }
  return (CACHE[key] = evalSeries(am, pm, A.L, item));
}
function evalRegion(item, codes) {                     // รวมเฉพาะ รพ.ที่ส่งครบถึงเดือนล่าสุด (เทียบแผนชุดเดียวกัน)
  var am = [], pm = [], k, L = META.latest_month;
  for (k = 0; k < 12; k++) { am.push(k < L ? 0 : null); pm.push(0); }
  codes.forEach(function (hc) {
    var arr = ACT[hc].m[item] || [];
    for (k = 0; k < 12; k++) { if (k < L) am[k] += arr[k] || 0; pm[k] += planM(hc, item, k); }
  });
  return evalSeries(am, pm, L, item);
}
function itemsFor(hc) {                                // เฉพาะรายการที่มีตัวเลข (แผนหรือผลจริงไม่เป็น 0)
  return META.items.filter(function (it) {
    var e = evalItem(hc, it.id); if (!e) return false;
    return e.plan !== 0 || e.act !== 0;
  });
}
function hospSummary(hc) {
  var A = ACT[hc], r = { hc: hc, h: HOSP[hc], L: A ? A.L : 0 };
  if (!r.L) { r.na = true; return r; }
  r.rev = evalItem(hc, 'P_REV_TOTAL'); r.exp = evalItem(hc, 'P_EXP_TOTAL');
  var its = itemsFor(hc); r.n = its.length; r.out = its.filter(function (it) { return evalItem(hc, it.id).st !== 'ok'; }).length;
  r.late = r.L < META.latest_month;
  return r;
}

/* ====================== วาดกราฟ (SVG) ====================== */
var TIP = $('#tip');
function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))); var n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function yScale(vals) {
  var mx = Math.max.apply(null, vals.concat([0])), mn = Math.min.apply(null, vals.concat([0]));
  var hi = niceMax(mx * 1.08), lo = mn < 0 ? -niceMax(-mn * 1.08) : 0;
  return { lo: lo, hi: hi == 0 ? 1 : hi };
}
function axTicks(s) { var t = [], n = 4; for (var i = 0; i <= n; i++) t.push(s.lo + (s.hi - s.lo) * i / n); return t; }

  var key = { prov: function (s) { return s.h.p + s.h.n; }, name: function (s) { return s.h.n; }, rev: function (s) { return s.na ? 999 : Math.abs(s.rev.pct == null ? 999 : s.rev.pct); }, exp: function (s) { return s.na ? 999 : Math.abs(s.exp.pct == null ? 999 : s.exp.pct); }, out: function (s) { return s.na ? -1 : s.out; } }[FS.sort];
  rows.sort(function (a, b) { var x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * FS.dir; });
  var th = function (k, t, c) { return '<th data-sort="' + k + '" class="' + (c || '') + '">' + t + (FS.sort === k ? (FS.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; };
  var h = '<div class="tablebox"><table><thead><tr>' + th('name', 'โรงพยาบาล', 'l') + '<th>แผนรายได้</th><th>ผลจริงรายได้</th>' + th('rev', '% รายได้') + '<th>แผนค่าใช้จ่าย</th><th>ผลจริงค่าใช้จ่าย</th>' + th('exp', '% ค่าใช้จ่าย') + th('out', 'รายการนอกเกณฑ์') + '<th>สถานะ</th></tr></thead><tbody>';
  rows.forEach(function (s) {
    var nm = '<td class="l hname">' + esc(s.h.n) + '<span class="sub">' + esc(s.h.p) + ' · ' + s.hc + (s.late ? ' · ข้อมูลถึง ' + MONTHS[s.L - 1] : '') + '</span></td>';
    if (s.na) h += '<tr class="clickable" data-h="' + s.hc + '">' + nm + '<td colspan="7" style="text-align:center" class="muted">ยังไม่มีข้อมูลผลจริง</td><td>' + pill(null) + '</td></tr>';
    else h += '<tr class="clickable" data-h="' + s.hc + '">' + nm + '<td class="num">' + fmtMB(s.rev.plan) + '</td><td class="num">' + (MODE === 'num' ? hlE(s.rev, fmtMB(s.rev.act)) : fmtMB(s.rev.act)) + '</td><td>' + pctCell(s.rev) + '</td><td class="num">' + fmtMB(s.exp.plan) + '</td><td class="num">' + (MODE === 'num' ? hlE(s.exp, fmtMB(s.exp.act)) : fmtMB(s.exp.act)) + '</td><td>' + pctCell(s.exp) + '</td><td class="num">' + s.out + '/' + s.n + '</td><td>' + pill(overall(s)) + '</td></tr>';
  });
  h += '</tbody></table></div><div class="legendq">' + LEGENDQ + '</div><div class="note" style="margin:6px 2px">แสดง ' + rows.length + ' แห่ง · ตัวเลขเป็นล้านบาท สะสมถึงเดือนล่าสุดของแต่ละแห่ง · คลิกแถวเพื่อดูรายละเอียด</div>';

}
function bindFilters(sums) {

function qualityBox() {

/* ====================== หน้า: รายโรงพยาบาล ====================== */
var OPEN = {}, SHOWZERO = false;

    kpi('EBITDA', fmtMB(evalItem(hc, 'P_EBITDA').act), 'แผน ' + fmtMB(evalItem(hc, 'P_EBITDA').plan) + ' ลบ. · ' + fmtPctSigned(evalItem(hc, 'P_EBITDA').pct)) + '</div>';
  h += evPanel('รวมรายได้', sum.rev) + evPanel('รวมค่าใช้จ่าย', sum.exp);

  h += '<div class="tablebox"><table id="itemTable"><thead><tr><th class="l">รายการ</th><th>แผนสะสม (บาท)</th><th>ผลจริงสะสม (บาท)</th><th>ส่วนต่าง</th><th>%</th><th>สถานะ</th></tr></thead><tbody>';
  var grp = { rev: 'รายได้', sumrev: 'สรุป', exp: 'ค่าใช้จ่าย', sumexp: 'สรุป', sum: 'ผลลัพธ์' }, last = '';
  META.items.forEach(function (it) {

    var gname = it.g === 'rev' ? 'รายได้' : it.g === 'exp' ? 'ค่าใช้จ่าย' : it.g === 'sum' ? 'ผลลัพธ์' : null;
    if (gname && gname !== last) { h += '<tr class="grp"><td colspan="6">' + gname + '</td></tr>'; last = gname; }
    var open = !!OPEN[hc + it.id];
    h += '<tr class="clickable' + (it.g.indexOf('sum') === 0 ? ' ytd' : '') + '" data-item="' + it.id + '"><td class="l hname" style="' + (it.g.indexOf('sum') === 0 ? 'font-weight:700' : '') + '">' + (open ? '▾ ' : '▸ ') + (it.g.indexOf('sum') === 0 ? '' : '<span class="muted">' + it.id + '</span> ') + esc(it.label) + '</td><td class="num">' + fmtBaht(e.plan) + '</td><td class="num">' + hlE(e, fmtBaht(e.act)) + '</td><td class="num">' + hlE(e, (e.diff > 0 ? '+' : '') + fmtBaht(e.diff)) + '</td><td class="num">' + hlE(e, fmtPctSigned(e.pct), false, true) + '</td><td>' + pill(e) + '</td></tr>';
    if (open) h += '<tr class="acc-row"><td colspan="6"><div class="acc-in">' + evPanel(it.label, e) + '</div></td></tr>';
  });
  h += '</tbody></table></div><div class="legendq">' + LEGENDQ + '</div><div class="foot">ผลจริงมาจากรายงาน Planfin ของระบบ HFA (กศภ.) · แผนจากไฟล์ worksheet ที่ รพ. ส่ง · <a href="#/about">วิธีอ่าน/นิยาม</a></div>';
  $('#app').innerHTML = h; attachTips($('#app')); bindPicker(); bindMode();

function pillHtml(e) { return pill(e); }
function pageHospPick() {

    '<h3>แหล่งข้อมูล</h3><ul><li>ผลจริง: ระบบ HFA กศภ. ดึงเมื่อ ' + thaiDateTime(META.pulled_at) + ' · ข้อมูลถึงเดือน ' + MONTHS[META.latest_month - 1] + ' · ส่งแล้ว ' + META.sent + '/' + META.total + ' แห่ง</li>' +
    v.map(function (x) { return '<li>แผน: ' + esc(x.label) + ' ' + (x === v[v.length - 1] ? '(ฉบับที่ใช้คำนวณ)' : '(ถูกแทนที่แล้ว)') + '</li>'; }).join('') + '</ul>' +

}

/* ====================== Router / เริ่มระบบ ====================== */
function bindMode() {
  document.querySelectorAll('.seg button[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { MODE = b.dataset.mode; try { localStorage.setItem('pfm-mode', MODE); } catch (e) {} var sy = scrollY; route(); scrollTo(0, sy); });
  });
}
function route() {
  var hash = location.hash || '#/', m = hash.match(/^#\/(h)?\/?([^/]*)/), r = 'home';
  TIPS = {}; TIP.style.display = 'none';
  if (hash.indexOf('#/about') === 0) r = 'about'; else if (hash.indexOf('#/h') === 0) r = 'h';
  document.querySelectorAll('[data-r]').forEach(function (a) { a.classList.toggle('active', a.dataset.r === r); });
  closeDrawer();
  if (r === 'about') pageAbout(); else if (r === 'h') pageHosp(hash.split('/')[2]); else pageHome();
  if (r === 'home') bindMode();
}
function openDrawer() { $('#drawer').classList.add('open'); $('#backdrop').classList.add('show'); }
function closeDrawer() { $('#drawer').classList.remove('open'); $('#backdrop').classList.remove('show'); }
$('#btnMenu').addEventListener('click', openDrawer); $('#btnClose').addEventListener('click', closeDrawer); $('#backdrop').addEventListener('click', closeDrawer);
$('#btnTheme').addEventListener('click', function () {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('pfm-theme', t); } catch (e) {}
  route();
});
window.addEventListener('hashchange', function () { route(); scrollTo(0, 0); });

function load(u) { return fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }); }
Promise.all([load('data/meta.json'), load('data/plan.json'), load('data/actual.json')]).then(function (d) {
  META = d[0]; PLAN = d[1]; ACT = d[2].hospitals; TOL = META.tolerance_pct || 5; MONTHS = META.months;
  META.hospitals.forEach(function (h) { HOSP[h.c] = h; });
  route();
}).catch(function (e) { $('#app').innerHTML = '<div class="card warnbox">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + ' — ลองรีเฟรชหน้านี้อีกครั้ง</div>'; });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.addEventListener('message', function (ev) {
    if (ev.data && ev.data.type === 'data-stale' && !DATA_STALE) { DATA_STALE = true; if (META) route(); }
  });
}
